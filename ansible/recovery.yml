---
- name: Recover Node Exporter on client
  hosts: client
  become: true

  tasks:
    - name: Ensure Node Exporter is running
      ansible.builtin.systemd:
        name: "{{ node_exporter_service }}"
        enabled: true
        state: started

- name: Verify recovered client from monitor
  hosts: monitor
  become: false

  tasks:
    - name: Verify client metrics endpoint
      ansible.builtin.uri:
        url: "http://{{ client_private_ip }}:{{ node_exporter_port }}/metrics"
        status_code: 200
      register: exporter_health
      retries: 5
      delay: 3
      until: exporter_health.status | default(0) == 200

    - name: Confirm recovery
      ansible.builtin.debug:
        msg: "Client Node Exporter is reachable from the monitoring server."
