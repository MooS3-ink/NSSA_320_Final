---
- name: Install common system packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - python3
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Allow authorized SSH access to monitor
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ allowed_admin_cidrs }}"
  when: "'monitor' in group_names"

- name: Allow SSH from monitor to client
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ monitor_private_ip }}"
  when: "'client' in group_names"

- name: Allow Grafana from authorized networks
  community.general.ufw:
    rule: allow
    port: "{{ grafana_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ allowed_admin_cidrs }}"
  when: "'monitor' in group_names"

- name: Allow Prometheus to scrape client metrics
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_port | string }}"
    proto: tcp
    from_ip: "{{ monitor_private_ip }}"
  when: "'client' in group_names"

- name: Allow outbound traffic
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Deny unauthorized incoming traffic
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Enable UFW firewall
  community.general.ufw:
    state: enabled
